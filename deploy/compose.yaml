services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8501"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /home/streamlit:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO:?Define el dominio en deploy/.env}
      APP_USER: ${APP_USER:?Define el usuario de acceso en deploy/.env}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Genera el hash de contraseña y configúralo en deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
